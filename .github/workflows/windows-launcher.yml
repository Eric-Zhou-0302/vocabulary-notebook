name: Windows launcher
on: [push, pull_request]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: ./tools/windows/build-launcher.ps1
        shell: pwsh
      - run: python -m pytest -q tests/test_desktop_launcher.py
